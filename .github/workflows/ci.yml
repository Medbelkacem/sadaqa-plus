name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Values used only by CI. Real secrets never appear in this file.
  DATABASE_URL: postgresql://sadaqa:sadaqa@localhost:5432/sadaqa_test?schema=public
  AUTH_SECRET: ci-secret-at-least-32-characters-long-abcdefgh
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  CRON_SECRET: ci-cron-secret
  EMAIL_DRIVER: log
  STORAGE_DRIVER: local
  PAYMENT_PROVIDER: none

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-and-e2e:
    name: Migrate · Build · E2E
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sadaqa
          POSTGRES_PASSWORD: sadaqa
          POSTGRES_DB: sadaqa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sadaqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed reference data
        run: npm run db:seed

      - name: Assert the seed created no activity
        # The zero-demo-data rule, enforced by CI rather than by convention.
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const p = new PrismaClient();
            (async () => {
              const [users, orgs, requests, campaigns, events, donations] = await Promise.all([
                p.user.count(), p.organization.count(), p.request.count(),
                p.campaign.count(), p.event.count(), p.donation.count(),
              ]);
              const total = users + orgs + requests + campaigns + events + donations;
              console.log({ users, orgs, requests, campaigns, events, donations });
              if (total !== 0) {
                console.error('Seed created activity rows; the database must start empty.');
                process.exit(1);
              }
              const [wilayas, communes, categories, roles] = await Promise.all([
                p.wilaya.count(), p.commune.count(), p.category.count(), p.role.count(),
              ]);
              console.log({ wilayas, communes, categories, roles });
              if (wilayas !== 58 || communes !== 1541 || roles !== 7) {
                console.error('Reference data is incomplete.');
                process.exit(1);
              }
              await p.\$disconnect();
            })();
          "

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the production server
        run: |
          npx next start --port 3100 &
          echo $! > .server.pid
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3100/fr && exit 0
            sleep 1
          done
          echo "Server did not become ready in 60s"
          exit 1

      - name: E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3100

      - name: Stop the server
        if: always()
        run: kill "$(cat .server.pid)" || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # High and critical advisories fail the build; moderate ones are
        # reported for triage without blocking a security patch release.
        run: npm audit --omit=dev --audit-level=high

      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.local$'; then
            echo "A .env file is committed. Remove it and rotate the secrets."
            exit 1
          fi
          echo "No committed .env files."
